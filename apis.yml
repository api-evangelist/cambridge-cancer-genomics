name: Cambridge Cancer Genomics
description: 'Cambridge Cancer Genomics (CCG.ai) was a Cambridge, UK precision-oncology company founded
  in 2015 out of the University of Cambridge, building OncOS, an AI/machine-learning platform that analyzed
  genomic data from liquid biopsies (circulating tumor DNA) to help oncologists track tumor evolution and
  personalize cancer treatment. The company was a Y Combinator alumnus in the digital-biology sector and
  was acquired by Dante Labs in June 2021, after which OncOS was folded into Dante Labs'' genomics platform.
  As of this enrichment pass the CCG.ai domain redirects to a domain-sale marketplace and the company
  operates no independent public developer or API surface; its historical first-party code lives only in
  the ccgenomics GitHub organization (research repositories, not published API SDKs).'
